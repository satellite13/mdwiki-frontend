replicaCount: 1

image:
  repository: mdwiki-frontend
  tag: local
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mdwiki.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

api:
  upstream: http://mdwiki-api-mdwiki-api:8080

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
