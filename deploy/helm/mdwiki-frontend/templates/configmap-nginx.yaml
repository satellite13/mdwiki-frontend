apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mdwiki-frontend.fullname" . }}-nginx
  labels:
    {{- include "mdwiki-frontend.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location = /api {
        return 301 /api/;
      }

      location /api/events/tree {
        proxy_pass {{ .Values.api.upstream }};
        proxy_http_version 1.1;
        proxy_read_timeout {{ .Values.api.eventsReadTimeout | default "300s" }};
        proxy_send_timeout {{ .Values.api.eventsReadTimeout | default "300s" }};
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /api/ {
        client_max_body_size {{ .Values.api.clientMaxBodySize | default "25m" }};
        proxy_pass {{ .Values.api.upstream }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
